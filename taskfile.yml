# Перед использованием установить https://taskfile.dev/installation/
# и goose CLI: go install github.com/pressly/goose/v3/cmd/goose@latest

version: '3'

dotenv: [ ".env" ]

vars:
  DB_VERSION_TABLE: "public.http_service_goose_db_version"
  DB_URL: '{{.DB_URL | default "postgres://postgres:password@localhost:5432/postgres?sslmode=disable"}}'

tasks:
  migration-up:
    cmds:
      - goose -table {{.DB_VERSION_TABLE}} -dir ./migrations postgres "{{.DB_URL}}" up
    silent: true

  migration-down:
    cmds:
      - goose -table {{.DB_VERSION_TABLE}} -dir ./migrations postgres "{{.DB_URL}}" down
    silent: true

  migration-generate: ## task migration-generate -- my_migration_name
    cmds:
      - goose -dir ./migrations create {{.name}} sql
    silent: true
    vars:
      name: "{{.CLI_ARGS}}"
